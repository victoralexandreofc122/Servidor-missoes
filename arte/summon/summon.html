<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summon Effect</title>
<style>
  :root { --bg:#000; --ui:#0c1317; --line:#1d2c34; --txt:#bfe6f2; }
  html,body { margin:0; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui,sans-serif; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
  canvas { display:block; background:#000; max-width:min(92vw,620px); max-height:78vh; width:auto; height:auto; outline:1px solid #111; }
  #ui { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; max-width:640px; }
  button, select { background:var(--ui); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:#3a6575; }
  input[type=range] { width:min(86vw,600px); accent-color:#7fdcff; }
  #info { font-variant-numeric:tabular-nums; opacity:.8; min-width:150px; text-align:center; }
  /* modo headless (?headless=1): só o canvas, em tamanho real, para captura frame a frame */
  body.headless #wrap { padding:0; }
  body.headless #ui, body.headless #scrub { display:none; }
  body.headless canvas { max-width:none; max-height:none; outline:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <input id="scrub" type="range" min="0" value="0" step="1">
  <div id="ui">
    <button id="play">⏸ Pausar</button>
    <button id="prev">◀ frame</button>
    <button id="next">frame ▶</button>
    <span id="info"></span>
    <select id="fmt">
      <option value="square">1080×1080</option>
      <option value="vertical">1080×1920</option>
    </select>
    <button id="png">PNG do frame</button>
    <button id="webm">Exportar WebM</button>
  </div>
</div>

<script>
/* =====================================================================
   SUMMON / MATERIALIZAÇÃO DE ENERGIA
   Tudo é função pura do número do frame: renderFrame(n) sempre gera
   exatamente a mesma imagem. Nenhum timer, nenhum Math.random().
   ===================================================================== */

// ---------- Configuração ----------
const params   = new URLSearchParams(location.search);
const FORMAT   = params.get('format') === 'vertical' ? 'vertical' : 'square';
const HEADLESS = params.get('headless') === '1';
if (HEADLESS) document.body.classList.add('headless');

const W = 1080, H = FORMAT === 'vertical' ? 1920 : 1080;
const FPS = 60;
const STAR_IN = 3.5;                                 // entrada da estrela até o estouro, no "tempo da estrela" (s)
const FAST_SRC  = 1.90;                              // trecho inicial do crescimento (antigos frames 0–114)...
const FAST_REAL = 0.35;                              // ...comprimido para 0,35 s reais
const STAR_REAL = STAR_IN - (FAST_SRC - FAST_REAL);  // duração real da entrada (1,95 s)
const SHIFT   = STAR_REAL - 0.08;                    // atraso aplicado ao resto da cena (raios, cilindro...)
const DURATION = 3.8 + SHIFT;                        // ≈5,67 s
const TOTAL = Math.round(FPS * DURATION);           // 340 frames

const U        = W / 1080;                          // unidade de escala
const CX       = W / 2;
const STAR_Y   = FORMAT === 'vertical' ? H * 0.405 : H * 0.335;
const GROUND_Y = FORMAT === 'vertical' ? H * 0.625 : H * 0.735;
const COL_H    = GROUND_Y - STAR_Y;
const R        = 70 * U;                            // raio do cilindro
const RING_RX  = 150 * U;                           // círculo no chão
const RING_RY  = RING_RX * 0.27;                    // achatamento (perspectiva)

// Paleta: branco → ciano → azul espiritual
const WHITE = [255, 255, 255];
const ICE   = [205, 245, 255];
const CYAN  = [120, 220, 255];
const BLUE  = [70, 140, 255];
const rgba  = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a))})`;

// ---------- Matemática ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp  = (a, b, t) => a + (b - a) * t;
const prog  = (t, a, b) => clamp((t - a) / (b - a));               // 0→1 entre a e b
const smooth        = x => x * x * (3 - 2 * x);
const easeOutCubic  = x => 1 - Math.pow(1 - x, 3);
const easeInCubic   = x => x * x * x;
const easeInQuad    = x => x * x;
const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const easeOutExpo   = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeOutBack   = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const bump          = (t, a, b) => (t <= a || t >= b) ? 0 : Math.sin(Math.PI * (t - a) / (b - a));
const TAU = Math.PI * 2;

// PRNG com semente fixa → propriedades de partículas/raios determinísticas
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- Elementos pré-calculados (sem dependência de tempo real) ----------
const rnd = mulberry32(20261021);

// Raios de luz ("chuva de luz")
const RAYS = Array.from({ length: 46 }, (_, i) => {
  const early = i < 26;                                    // 1ª onda densa, 2ª onda mais esparsa
  const ts = early ? 0.40 + Math.pow(rnd(), 1.4) * 0.55 : 1.05 + rnd() * 1.15;
  const spread = (rnd() + rnd() - 1);                      // distribuição triangular, concentrada no centro
  // raios mais antigos começam mais abertos → leitura de "convergir" para o cilindro
  const open = lerp(1.9, 1.0, smooth(prog(ts, 0.40, 0.95)));
  return {
    ts,
    dur:   0.30 + rnd() * 0.22,
    x:     CX + spread * R * 1.05 * open,
    len:   (110 + rnd() * 210) * U,
    width: (1.0 + rnd() * 1.6) * U,
    alpha: early ? 0.55 + rnd() * 0.45 : 0.30 + rnd() * 0.35,
  };
});

// Partículas subindo
const PARTICLES = Array.from({ length: 150 }, () => ({
  t0:    1.10 + rnd() * 2.05,
  life:  0.75 + rnd() * 0.75,
  x:     (rnd() * 2 - 1) * 0.95,
  rise:  (0.55 + rnd() * 0.75) * COL_H,
  size:  (1.5 + rnd() * 2.5) * U,
  freq:  2 + rnd() * 4,
  phase: rnd() * TAU,
  wob:   (3 + rnd() * 7) * U,
  spark: rnd() < 0.12,                                     // algumas viram mini-estrelas cintilantes
}));

// Ondas de choque no chão
const RIPPLES = [1.30, 1.72, 2.10, 2.46, 3.02];

// ---------- Canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const colCv = document.createElement('canvas');            // buffer do cilindro
const colCtx = colCv.getContext('2d');
const bloomA = document.createElement('canvas');           // bloom fino
const bloomB = document.createElement('canvas');           // bloom largo
const bA = bloomA.getContext('2d'), bB = bloomB.getContext('2d');

function resize() {
  canvas.width = colCv.width = W;
  canvas.height = colCv.height = H;
  bloomA.width = W / 4;  bloomA.height = H / 4;
  bloomB.width = W / 8;  bloomB.height = H / 8;
}
resize();

// ---------- Primitivas de desenho ----------
function radial(c, x, y, r, stops) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  for (const [o, col] of stops) g.addColorStop(o, col);
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}

// Glow elíptico (círculo achatado no chão)
function ellipseGlow(c, x, y, rx, ry, stops) {
  c.save();
  c.translate(x, y);
  c.scale(1, ry / rx);
  radial(c, 0, 0, rx, stops);
  c.restore();
}

// Estrela de 4 pontas clássica (lados côncavos)
function sparklePath(c, x, y, r, rot, pinch = 0.18) {
  c.beginPath();
  for (let k = 0; k < 4; k++) {
    const a  = rot + k * TAU / 4;
    const an = rot + (k + 1) * TAU / 4;
    const am = (a + an) / 2;
    const px = x + Math.cos(a) * r,  py = y + Math.sin(a) * r;
    const nx = x + Math.cos(an) * r, ny = y + Math.sin(an) * r;
    const qx = x + Math.cos(am) * r * pinch, qy = y + Math.sin(am) * r * pinch;
    if (k === 0) c.moveTo(px, py);
    c.quadraticCurveTo(qx, qy, nx, ny);
  }
  c.closePath();
}

function sparkle(c, x, y, r, rot, alpha) {
  if (r <= 0.2 || alpha <= 0.001) return;
  radial(c, x, y, r * 2.6, [[0, rgba(CYAN, 0.55 * alpha)], [0.35, rgba(BLUE, 0.18 * alpha)], [1, rgba(BLUE, 0)]]);
  c.fillStyle = rgba(CYAN, 0.6 * alpha);
  sparklePath(c, x, y, r * 1.12, rot, 0.22); c.fill();
  c.fillStyle = rgba(WHITE, alpha);
  sparklePath(c, x, y, r, rot, 0.16); c.fill();
  radial(c, x, y, r * 0.45, [[0, rgba(WHITE, alpha)], [1, rgba(WHITE, 0)]]);
}

// Linha de lens flare horizontal/vertical
function flareLine(c, x, y, len, thick, alpha, vertical) {
  const g = vertical ? c.createLinearGradient(x, y - len, x, y + len)
                     : c.createLinearGradient(x - len, y, x + len, y);
  g.addColorStop(0, rgba(CYAN, 0));
  g.addColorStop(0.5, rgba(WHITE, alpha));
  g.addColorStop(1, rgba(CYAN, 0));
  c.fillStyle = g;
  if (vertical) c.fillRect(x - thick / 2, y - len, thick, len * 2);
  else          c.fillRect(x - len, y - thick / 2, len * 2, thick);
}

// ---------- Curvas de timeline (todas f(t)) ----------
// Fase 1 — estrela (tempo absoluto). Entrada lenta com a borda nítida, depois o estouro.
function starTimeline(t) {
  const B = STAR_IN;
  const grow   = easeInOutSine(prog(t, 0.0, B - 0.3));
  const breath = 1 + 0.035 * Math.sin(TAU * 0.7 * t) * smooth(prog(t, 0.4, 1.2));
  const punch  = 1 + 0.3 * easeInOutSine(prog(t, B, B + 0.14));           // incha no estouro
  const shrink = easeInOutSine(prog(t, B + 0.12, B + 0.44));
  return {
    scale:  0.85 * grow * breath * punch * (1 - 0.92 * shrink),
    alpha:  smooth(prog(t, 0, 0.25)) * (1 - smooth(prog(t, B + 0.22, B + 0.44))),
    rot:    lerp(-0.7, 0.1, easeInOutSine(prog(t, 0, B + 0.44))),
    charge: easeInOutSine(prog(t, 1.0, B)),                                // energia acumulando antes do estouro
    flash:  easeInOutSine(smooth(prog(t, B, B + 0.18))) * (1 - easeInOutSine(prog(t, B + 0.18, B + 0.48))),
  };
}

// Tempo real → tempo da estrela. Os primeiros FAST_REAL s percorrem FAST_SRC s de animação
// por uma curva Hermite cúbica (rápida no início, chegando com velocidade 1 → sem tranco na emenda).
function starTime(ta) {
  if (ta >= FAST_REAL) return ta - FAST_REAL + FAST_SRC;
  const u = ta / FAST_REAL, T = FAST_REAL;
  const m0 = 1.8 * FAST_SRC / FAST_REAL, m1 = 1;          // velocidades no início e na emenda (curva monotônica)
  const h10 = u * u * u - 2 * u * u + u, h01 = -2 * u * u * u + 3 * u * u, h11 = u * u * u - u * u;
  return m0 * T * h10 + FAST_SRC * h01 + m1 * T * h11;
}

// Demais fases: t já descontado de SHIFT
function timeline(t) {
  // Semente de luz que permanece no ponto da estrela e alimenta os raios
  const seed = smooth(prog(t, 0.28, 0.45)) * (1 - smooth(prog(t, 0.95, 1.35)));

  // Fase 2–3 — cilindro
  const form      = smooth(prog(t, 0.75, 1.25));
  const intensify = easeInOutSine(prog(t, 1.20, 2.25));
  const conc      = bump(t, 2.38, 2.80);                    // concentração / pico
  const narrow    = 1 - 0.2 * smooth(prog(t, 2.35, 2.62));
  const dissolveP = prog(t, 2.70, 3.45);
  const colFade   = 1 - smooth(prog(t, 2.95, 3.50));
  const pulse     = 0.86 + 0.14 * Math.sin(TAU * (3.2 * t + 0.6 * t * t)) * smooth(prog(t, 1.1, 1.4));
  const col = {
    alpha:  form * lerp(0.38, 1.0, intensify) * pulse * (1 + 0.35 * conc) * colFade,
    width:  lerp(0.45, 1, form) * narrow,
    bottom: lerp(GROUND_Y, STAR_Y - 340 * U, easeInCubic(dissolveP)),
    top:    STAR_Y - lerp(40, 360, smooth(prog(t, 0.9, 1.8))) * U - easeInCubic(dissolveP) * 160 * U,
  };

  // Círculo de luz no chão
  let ground = 0.32 * smooth(prog(t, 0.72, 1.30)) + 0.68 * easeInOutSine(prog(t, 1.20, 2.30));
  ground *= lerp(1, 0.58, smooth(prog(t, 2.70, 3.10)));      // excesso de energia se dissipa
  ground += 0.32 * conc;                                     // pico na materialização
  ground += 0.22 * bump(t, 2.98, 3.42);                      // pulso final
  ground += 0.025 * Math.sin(TAU * 0.9 * t) * smooth(prog(t, 3.35, 3.6)); // respiração residual

  const raysAlpha = 1 - smooth(prog(t, 2.25, 2.70));
  const particles = smooth(prog(t, 1.15, 1.50)) * (1 - smooth(prog(t, 3.15, 3.65)));

  return { seed, col, ground, conc, raysAlpha, particles, dissolveP };
}

// ---------- Camadas ----------
function drawStar(c, ta) {
  const t = starTime(ta);
  if (t > STAR_IN + 0.5) return;
  const s = starTimeline(t);
  // brilho ambiente suave que cresce durante a entrada (sem esconder a borda)
  if (s.charge > 0.001)
    radial(c, CX, STAR_Y, 320 * U, [[0, rgba(CYAN, 0.16 * s.charge * s.alpha)], [1, rgba(BLUE, 0)]]);
  // flash branco intenso que preenche a tela
  if (s.flash > 0.001) {
    radial(c, CX, STAR_Y, 700 * U, [[0, rgba(WHITE, 0.95 * s.flash)], [0.12, rgba(ICE, 0.45 * s.flash)],
                                    [0.45, rgba(CYAN, 0.10 * s.flash)], [1, rgba(BLUE, 0)]]);
  }
  const r = 95 * U * s.scale;
  const a = s.alpha;
  const fl = lerp(0.3, 1, Math.max(s.flash, 0.5 * s.charge));             // flares discretos na entrada
  flareLine(c, CX, STAR_Y, r * 3.4, 2.2 * U, 0.7 * a * fl, false);
  flareLine(c, CX, STAR_Y, r * 2.2, 1.6 * U, 0.45 * a * fl, true);
  sparkle(c, CX, STAR_Y, r, s.rot - Math.PI / 2, a);
}

function drawSeed(c, t, tl) {
  const a = tl.seed;
  if (a <= 0.001) return;
  const flick = 0.85 + 0.15 * Math.sin(TAU * 7 * t);
  radial(c, CX, STAR_Y, 90 * U, [[0, rgba(WHITE, 0.55 * a * flick)], [0.18, rgba(CYAN, 0.28 * a)], [1, rgba(BLUE, 0)]]);
}

// Opacidade dos raios pela altura: ~3% no ponto da estrela, 100% ao tocar o chão
const rayFade = y => lerp(0.03, 1, smooth(Math.pow(prog(y, STAR_Y, GROUND_Y), 1.3)));

function drawRays(c, t, tl) {
  if (tl.raysAlpha <= 0.001) return;
  for (const ray of RAYS) {
    const p = prog(t, ray.ts, ray.ts + ray.dur);
    if (p <= 0 || p >= 1) continue;
    const travel = COL_H + ray.len;
    const head = STAR_Y + easeInQuad(p) * travel;
    const tail = head - ray.len;
    const y0 = Math.max(STAR_Y, tail);
    const y1 = Math.min(GROUND_Y, head);
    if (y1 <= y0) continue;
    const a = ray.alpha * tl.raysAlpha * smooth(prog(p, 0, 0.12));
    // gradiente = rastro (cauda→cabeça) × posição na tela (topo quase invisível → chão pleno)
    const g = c.createLinearGradient(0, tail, 0, head);
    for (let s = 0; s <= 10; s++) {
      const o = s / 10;
      const trail = o < 0.7 ? 0.45 * smooth(o / 0.7) : lerp(0.45, 1, (o - 0.7) / 0.3);
      g.addColorStop(o, rgba(o < 0.85 ? CYAN : WHITE, a * trail * rayFade(tail + o * ray.len)));
    }
    // halo desfocado + núcleo fino
    c.fillStyle = g;
    c.globalAlpha = 0.28;
    c.fillRect(ray.x - ray.width * 4, y0, ray.width * 8, y1 - y0);
    c.globalAlpha = 1;
    c.fillRect(ray.x - ray.width / 2, y0, ray.width, y1 - y0);
    // cabeça luminosa
    if (head < GROUND_Y) radial(c, ray.x, head, 9 * U, [[0, rgba(WHITE, 0.7 * a * rayFade(head))], [1, rgba(CYAN, 0)]]);
    // impacto no chão: respingo achatado
    const impactT = Math.sqrt(COL_H / travel);              // p em que a cabeça toca o chão
    const k = prog(p, impactT, Math.min(1, impactT + 0.35));
    if (k > 0 && k < 1) {
      const ia = (1 - k) * a * 0.8;
      ellipseGlow(c, ray.x, GROUND_Y, (14 + 26 * k) * U, (4 + 7 * k) * U,
                  [[0, rgba(WHITE, ia)], [0.5, rgba(CYAN, ia * 0.4)], [1, rgba(CYAN, 0)]]);
    }
  }
}

function drawColumn(c, t, tl) {
  const col = tl.col;
  if (col.alpha <= 0.002 || col.bottom <= col.top) return;
  const cc = colCtx;
  cc.globalCompositeOperation = 'source-over';
  cc.clearRect(0, 0, W, H);
  cc.globalCompositeOperation = 'lighter';
  const w = R * col.width;
  const top = col.top, bot = col.bottom, h = bot - top;

  // camadas horizontais (borda suave)
  const band = (half, color, a) => {
    const g = cc.createLinearGradient(CX - half, 0, CX + half, 0);
    g.addColorStop(0, rgba(color, 0));
    g.addColorStop(0.5, rgba(color, a));
    g.addColorStop(1, rgba(color, 0));
    cc.fillStyle = g;
    cc.fillRect(CX - half, top, half * 2, h);
  };
  band(w * 2.6, BLUE, 0.16);
  band(w * 1.5, CYAN, 0.30);
  band(w * 1.0, ICE, 0.32);
  band(w * 0.38, WHITE, 0.70);
  band(2.2 * U, WHITE, 1.0);

  // bordas do cilindro (leve contorno de energia)
  for (const side of [-1, 1]) {
    const g = cc.createLinearGradient(CX + side * w - 6 * U, 0, CX + side * w + 6 * U, 0);
    g.addColorStop(0, rgba(CYAN, 0)); g.addColorStop(0.5, rgba(ICE, 0.22)); g.addColorStop(1, rgba(CYAN, 0));
    cc.fillStyle = g;
    cc.fillRect(CX + side * w - 6 * U, top, 12 * U, h);
  }

  // filamentos internos ondulantes (fluxo de energia)
  cc.lineWidth = 1.4 * U;
  for (let i = 0; i < 5; i++) {
    cc.strokeStyle = rgba(ICE, 0.16);
    cc.beginPath();
    for (let y = top; y <= bot; y += 8 * U) {
      const x = CX + Math.sin(y * 0.018 / U + t * (5 + i) + i * 1.7) * w * (0.25 + i * 0.13);
      if (y === top) cc.moveTo(x, y); else cc.lineTo(x, y);
    }
    cc.stroke();
  }

  // faixas de varredura subindo (toque pixel-art)
  const scanH = COL_H + 300 * U;
  for (let i = 0; i < 9; i++) {
    const yy = GROUND_Y - ((t * 520 * U + i * scanH / 9) % scanH);
    if (yy < top || yy > bot) continue;
    const g = cc.createLinearGradient(CX - w, 0, CX + w, 0);
    g.addColorStop(0, rgba(CYAN, 0)); g.addColorStop(0.5, rgba(WHITE, 0.22)); g.addColorStop(1, rgba(CYAN, 0));
    cc.fillStyle = g;
    cc.fillRect(CX - w, Math.round(yy / (3 * U)) * 3 * U, w * 2, 3 * U);
  }

  // máscara vertical: topo some suave, base com borda macia (sobe na dissolução)
  cc.globalCompositeOperation = 'destination-in';
  const soft = lerp(20, 140, smooth(tl.dissolveP)) * U;
  const m = cc.createLinearGradient(0, top, 0, bot);
  const fadeTop = clamp(Math.min(240 * U, h * 0.6) / h);
  m.addColorStop(0, 'rgba(255,255,255,0)');
  m.addColorStop(fadeTop, 'rgba(255,255,255,1)');
  m.addColorStop(clamp(1 - soft / h, fadeTop, 1), 'rgba(255,255,255,1)');
  m.addColorStop(1, 'rgba(255,255,255,0)');
  cc.fillStyle = m;
  cc.fillRect(0, 0, W, H);

  c.globalAlpha = clamp(col.alpha);
  c.drawImage(colCv, 0, 0);
  c.globalAlpha = 1;
}

function drawGround(c, t, tl) {
  const g = tl.ground;
  if (g <= 0.002) return;
  // halo amplo
  ellipseGlow(c, CX, GROUND_Y, RING_RX * 2.4, RING_RY * 2.6,
              [[0, rgba(CYAN, 0.30 * g)], [0.4, rgba(BLUE, 0.12 * g)], [1, rgba(BLUE, 0)]]);
  // disco de luz
  ellipseGlow(c, CX, GROUND_Y, RING_RX * 1.05, RING_RY * 1.05,
              [[0, rgba(WHITE, 0.85 * g)], [0.35, rgba(ICE, 0.45 * g)], [0.8, rgba(CYAN, 0.22 * g)], [1, rgba(CYAN, 0)]]);
  // anel
  c.save();
  c.translate(CX, GROUND_Y);
  c.scale(1, RING_RY / RING_RX);
  c.lineWidth = 12 * U; c.strokeStyle = rgba(CYAN, 0.16 * g);
  c.beginPath(); c.arc(0, 0, RING_RX, 0, TAU); c.stroke();
  c.lineWidth = 2.4 * U; c.strokeStyle = rgba(WHITE, 0.75 * Math.min(1, g));
  c.beginPath(); c.arc(0, 0, RING_RX, 0, TAU); c.stroke();
  // pontos quadrados girando (pixel-art)
  const n = 28, rr = RING_RX * 0.8, s = 3 * U;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + t * 0.7;
    const tw = 0.55 + 0.45 * Math.sin(t * 6 + i * 1.3);
    c.fillStyle = rgba(ICE, 0.55 * g * tw);
    c.fillRect(Math.cos(a) * rr - s / 2, Math.sin(a) * rr - s * 1.8, s, s * 3.6); // compensado pelo scale Y
  }
  c.restore();
  // ondas expandindo
  for (const t0 of RIPPLES) {
    const k = prog(t, t0, t0 + 0.75);
    if (k <= 0 || k >= 1) continue;
    const e = easeOutCubic(k), a = (1 - k) * 0.55;
    c.save();
    c.translate(CX, GROUND_Y);
    c.scale(1, RING_RY / RING_RX);
    c.lineWidth = lerp(5, 1.5, k) * U;
    c.strokeStyle = rgba(ICE, a);
    c.beginPath(); c.arc(0, 0, RING_RX * lerp(0.55, 1.75, e), 0, TAU); c.stroke();
    c.restore();
  }
  // brilho suave subindo do círculo
  ellipseGlow(c, CX, GROUND_Y - 10 * U, RING_RX * 0.9, 150 * U,
              [[0, rgba(ICE, 0.20 * g)], [0.5, rgba(CYAN, 0.07 * g)], [1, rgba(CYAN, 0)]]);
}

function drawParticles(c, t, tl) {
  if (tl.particles <= 0.002) return;
  const lift = easeInQuad(tl.dissolveP);                   // aceleram para cima na dissolução
  for (const p of PARTICLES) {
    const age = t - p.t0;
    if (age <= 0 || age >= p.life) continue;
    const k = age / p.life;
    const y = GROUND_Y - Math.pow(k, 0.85) * p.rise * (1 + lift * 0.8) - 4 * U;
    const x = CX + p.x * R * (1 - k * 0.25) + Math.sin(age * p.freq + p.phase) * p.wob;
    const a = Math.sin(Math.PI * k) * tl.particles;
    if (p.spark) {
      const tw = 0.5 + 0.5 * Math.sin(age * 14 + p.phase);
      sparkle(c, x, y, p.size * 2.6 * (0.6 + 0.4 * tw), age * 1.5, a * (0.6 + 0.4 * tw));
    } else {
      radial(c, x, y, p.size * 3.2, [[0, rgba(CYAN, 0.35 * a)], [1, rgba(BLUE, 0)]]);
      c.fillStyle = rgba(WHITE, 0.9 * a);
      c.fillRect(x - p.size / 2, y - p.size / 2, p.size, p.size);  // pixel quadrado
    }
  }
}

function bloom(c) {
  bA.globalCompositeOperation = 'copy';
  bA.filter = 'blur(3px)';
  bA.drawImage(canvas, 0, 0, bloomA.width, bloomA.height);
  bB.globalCompositeOperation = 'copy';
  bB.filter = 'blur(4px)';
  bB.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.imageSmoothingQuality = 'high';
  c.globalAlpha = 0.55; c.drawImage(bloomA, 0, 0, W, H);
  c.globalAlpha = 0.45; c.drawImage(bloomB, 0, 0, W, H);
  c.restore();
}

// ---------- Render de um frame ----------
function renderFrame(frame) {
  const f = clamp(Math.round(frame), 0, TOTAL - 1);
  const ta = f / FPS;                                      // tempo absoluto (estrela)
  const t = ta - SHIFT;                                    // tempo do resto da cena
  const tl = timeline(t);

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';               // luz soma luz
  drawGround(ctx, t, tl);
  drawColumn(ctx, t, tl);
  drawRays(ctx, t, tl);
  drawSeed(ctx, t, tl);
  drawParticles(ctx, t, tl);
  drawStar(ctx, ta);
  ctx.globalCompositeOperation = 'source-over';
  bloom(ctx);
  return f;
}
window.renderFrame = renderFrame;
window.TOTAL_FRAMES = TOTAL;
window.SIZE = { W, H, FPS };

// ---------- Player (o tempo real só decide QUAL frame mostrar) ----------
const scrub = document.getElementById('scrub');
const info = document.getElementById('info');
const playBtn = document.getElementById('play');
const fmtSel = document.getElementById('fmt');
scrub.max = TOTAL - 1;
fmtSel.value = FORMAT;

let current = 0, playing = !HEADLESS, last = null, acc = 0;

function show(f) {
  current = renderFrame(f);
  scrub.value = current;
  info.textContent = `frame ${String(current).padStart(3, '0')}/${TOTAL - 1} · ${(current / FPS).toFixed(2)}s`;
}

function loop(now) {
  if (playing) {
    if (last !== null) acc += (now - last) / 1000;
    const steps = Math.floor(acc * FPS);
    if (steps > 0) { acc -= steps / FPS; show((current + steps) % TOTAL); }
  }
  last = now;
  requestAnimationFrame(loop);
}

playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '⏸ Pausar' : '▶ Play'; };
document.getElementById('prev').onclick = () => { playing = false; playBtn.textContent = '▶ Play'; show((current - 1 + TOTAL) % TOTAL); };
document.getElementById('next').onclick = () => { playing = false; playBtn.textContent = '▶ Play'; show((current + 1) % TOTAL); };
scrub.oninput = () => { playing = false; playBtn.textContent = '▶ Play'; show(+scrub.value); };
fmtSel.onchange = () => { params.set('format', fmtSel.value); location.search = params.toString(); };

document.getElementById('png').onclick = () => {
  const a = document.createElement('a');
  a.download = `summon_${FORMAT}_${String(current).padStart(4, '0')}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
};

// Exportação no navegador: cada frame é renderizado e entregue manualmente ao encoder.
// Para saída 100% exata, prefira render.mjs (PNG sequence + ffmpeg).
document.getElementById('webm').onclick = async () => {
  const btn = document.getElementById('webm');
  playing = false;
  const stream = canvas.captureStream(0);
  const track = stream.getVideoTracks()[0];
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 40e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  const t0 = performance.now();
  for (let f = 0; f < TOTAL; f++) {
    show(f);
    track.requestFrame();
    btn.textContent = `Gravando ${Math.round(f / (TOTAL - 1) * 100)}%`;
    const target = t0 + (f + 1) * 1000 / FPS;
    await new Promise(r => setTimeout(r, Math.max(0, target - performance.now())));
  }
  rec.stop();
  await done;
  const a = document.createElement('a');
  a.download = `summon_${FORMAT}.webm`;
  a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
  a.click();
  btn.textContent = 'Exportar WebM';
};

show(0);
if (!HEADLESS) requestAnimationFrame(loop);
</script>
</body>
</html>
